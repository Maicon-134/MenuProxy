name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Apktool and Signer
        run: |
          mkdir -p bin
          curl -sLo bin/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          curl -sLo bin/uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          chmod +x bin/*.jar

      - name: Build APK with Apktool
        run: |
          java -jar bin/apktool.jar b . -o app-unsigned.apk --use-aapt2

      - name: Sign APK
        run: |
          java -jar bin/uber-apk-signer.jar --apks app-unsigned.apk --out output --allowResign

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MdkProxy-LocalServer-APK
          path: output/*.apk
          retention-days: 7
